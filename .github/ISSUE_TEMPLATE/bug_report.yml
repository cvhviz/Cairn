name: Bug report
description: Something doesn't work on a board running Cairn
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [install guides](https://github.com/cvhviz/Cairn#which-file-do-i-need) first: most install problems come from the wrong file or a missing erase.
        Problems in the phone app, or that also happen on stock MeshCore, belong with [MeshCore](https://github.com/meshcore-dev/MeshCore/issues).
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Seeed Wio Tracker L1 Pro
        - Seeed Wio Tracker L2 Pro
        - Heltec V4 + Expansion Kit (touch)
        - Heltec Mesh Node T096
        - LilyGO T-Display SF32
        - A preview board (name it below)
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File you flashed
      description: The exact file name, e.g. MeshCore-WioL2Pro-Cairn107-2026-10-05-update.bin. For a preview board this also names the board.
      placeholder: MeshCore-<Board>-CairnN-<date>...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Cairn build number
      description: The BUILD number on the splash screen (or Settings > About).
      placeholder: "107"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - UF2 copy (nRF52)
        - esptool, first install (-full.bin after erase)
        - esptool, update (-update.bin at 0x10000)
        - Web flasher
        - SF32 installer (Install on Mac / Windows / Linux)
        - Online update over Wi-Fi
        - Browser upload in update mode
        - Other (say below)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Chats
        2. ...
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw, and what you expected
      description: Photos of the screen help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: From boot if you can (USB serial, 115200 baud). Remove anything private, such as Wi-Fi names.
      render: text
  - type: input
    id: app
    attributes:
      label: MeshCore app and version (if involved)
      placeholder: Android 1.x / iOS / web
